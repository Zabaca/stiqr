# stiqr.zabaca.com moved to Cloudflare on 2026-07-30. This config stays because
# the Netlify site is the ROLLBACK TARGET: re-point the DNS record and Netlify
# serves again. It has to keep building for that to be true.
#
# Uses bun, because the pnpm workspace files are gone. Netlify's docs name
# bun.lockb, but it detects the text-format bun.lock we commit: proven by the
# deploy preview on this branch going from failure to success on that change
# alone.
#
# The functions are .cjs, not .js, and that matters. They are CommonJS
# (`exports.handler = ...`) while apps/frontend/package.json says
# "type": "module", so a .js extension makes Node treat them as ESM and every
# invocation dies with `ReferenceError: module is not defined in ES module
# scope`. Production never showed this because it was built before that "type"
# field landed; the first fresh build after it would have shipped a site whose
# proxies 502. Renaming them is what makes the rollback real rather than stated.
#
# James retired the rollback on 2026-07-30, so this file and netlify/functions/
# are now scheduled for deletion along with the /.netlify/functions/ paths in the
# Worker, which only exist to mirror them. Until that lands, note the Netlify
# integration is still connected to this repo and builds on every push.
[build]
  publish = "apps/frontend/dist"
  command = "bun run build"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  directory = "apps/frontend/netlify/functions"
